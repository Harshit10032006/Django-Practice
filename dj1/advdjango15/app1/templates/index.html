<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyModel List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            width: 70%;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
            color: #007bff;
        }

        .card p {
            color: #555;
            line-height: 1.6;
        }

        .empty {
            text-align: center;
            color: gray;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MyModel Records</h1>

        {% if users %}
            {% for item in users %}
                <div class="card">
                    <h2>{{ item.name }}</h2>
                    <p>{{ item.description }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p class="empty">No records found.</p>
        {% endif %}
    </div>

</body>
</html>
