{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <h1>Students</h1>

    {% if students %}
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>Update</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                    <tr>
                        <td><a href="{% url 'student_update' student.id %}">Edit</a></td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.rollno }}</td>
                        <td>{{ student.marks }}</td>
                        <td><a href="{% url 'delete_student' student.id %}" onclick="return confirm('Delete this student?');">Delete</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No students added yet.</p>
    {% endif %}

    <a href="{% url 'student_create' %}">Add Student</a>

</body>
</html>
