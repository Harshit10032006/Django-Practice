<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th,td{
            padding:12px;
            border:1px solid #ddd;
            text-align:left;
        }

        th{
            background:#0d6efd;
            color:white;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        tr:hover{
            background:#eef5ff;
        }

        .no-data{
            text-align:center;
            margin-top:20px;
            color:red;
            font-size:18px;
        }
    </style>
</head>
<body>

<h1>User List</h1>

{% if users %}
<table>
    <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Created At</th>
        </tr>
    </thead>

    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.created_at }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% else %}
    <p class="no-data">No users found.</p>
{% endif %}

</body>
</html>
