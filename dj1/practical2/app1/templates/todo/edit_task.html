{% extends 'base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0">Edit Task</h1>
        <a href="{% url 'form' %}" class="text-decoration-none text-muted-soft font-mono" style="font-size: 0.85rem;">&larr; back to list</a>
    </div>

    <div class="app-card p-4">
        <form method="POST" action="{% url 'update_task' task.id %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4">{{ task.description }}</textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="completed" name="completed" {% if task.completed %}checked{% endif %}>
                <label class="form-check-label" for="completed">
                    Mark as completed
                </label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-done">Save Changes</button>
                <a href="{% url 'form' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}
