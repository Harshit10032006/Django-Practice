{% extends 'base.html' %}

{% block title %}Add Task{% endblock %}

{% block content %}

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0">Add Task</h1>
        <a href="{% url 'form' %}" class="text-decoration-none text-muted-soft font-mono" style="font-size: 0.85rem;">&larr; back to list</a>
    </div>

    <div class="app-card p-4">
        <form method="POST" action="{% url 'add_task' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Title</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="What needs to be done?" required>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Add any extra details (optional)"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-done">Add Task</button>
                <a href="{% url 'form' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}
