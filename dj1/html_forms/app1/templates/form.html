<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>

    <h1>Get in Touch</h1>
    <p>Enter your name and mobile number below</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'submit_form' %}">
        {% csrf_token %}

        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="field">
            <label for="mobile">Mobile Model</label>
            <input type="text" id="mobile" name="mobile" placeholder="Enter your mobile model" required>
        </div>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
