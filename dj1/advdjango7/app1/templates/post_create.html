{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2>Create New Post</h2>

        <hr>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Create Post
            </button>

            <a href="{% url 'post_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
