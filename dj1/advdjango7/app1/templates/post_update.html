{% extends "base.html" %}

{% block title %}
Update Post
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2>Update Post</h2>

        <hr>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Update Post
            </button>

            <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
